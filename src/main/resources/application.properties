# Database - Local development
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=update
quarkus.datasource.devservices.enabled=false

# Railway: use DATABASE_URL if available (TCP proxy), otherwise individual vars
# Railway provides: DATABASE_URL or PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:quarkus}}
quarkus.datasource.username=${PGUSER:quarkus}
quarkus.datasource.password=${PGPASSWORD:quarkus}

# Dev profile override
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus
%dev.quarkus.datasource.username=quarkus
%dev.quarkus.datasource.password=quarkus

# Test profile - use PostgreSQL with TestContainers
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# OpenAPI/Swagger
quarkus.smallrye-openapi.path=/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Mi Primer Quarkus API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para gestión de productos y tareas

# Health Checks
quarkus.smallrye-health.root-path=/health

# JWT - solo habilitar en prod
%dev.quarkus.smallrye-jwt.enabled=false
%test.quarkus.smallrye-jwt.enabled=false

# Logging
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.category."com.david".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE
